    text { font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #2d3142; text-anchor: middle; }
    .node { fill: #ffffff; stroke: #2d3142; stroke-width: 1.25; }
    .zone { fill: none; stroke: #2d3142; stroke-width: 1.25; }
    .dashed { stroke-dasharray: 6 5; }
    .arrow { fill: none; stroke: #4f5d75; stroke-width: 1.5; }
  </style>

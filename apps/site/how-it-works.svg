<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
  <title id="how-it-works-title">How project-os works</title>
  <desc id="how-it-works-desc">Discord and email brokers send messages to the classifier inside Project OS, which passes them through Pi Durable to the ticket system, next to Project Memory; tickets go to a cloud serverless sandbox, and a local PC runs Claude, Codex, or pi.</desc>

# Local POC target. The Watcher runs on the host (it spawns local Claude Code) and
# talks to the published Coordinator port: MCP_URL=http://localhost:8080/mcp (§5.6).
services:
  coordinator:
    build: { context: ., dockerfile: apps/coordinator/Dockerfile }
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/project-os.sqlite
      PI_STORAGE_PATH: /data/pi-durable.sqlite
      DISCORD_ADAPTER_URL: http://discord-adapter:8081
      WORKER_ID: ${WORKER_ID:-local-claude-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-openrouter}
      CHAT_MODEL_ID: ${CHAT_MODEL_ID:-anthropic/claude-sonnet-4.5}
      JEV_MODEL_ID: ${JEV_MODEL_ID:-typesafe/jev-1.14}
      INTENT_CONFIDENCE_THRESHOLD: ${INTENT_CONFIDENCE_THRESHOLD:-0.5}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      # Pi Durable traces + metrics -> the lgtm service (Grafana at http://localhost:3000).
      # Forced, like the data paths: a host .env value (localhost:4318) would point at the container itself.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes: ["coordinator-data:/data"]
    depends_on: [lgtm]

  # Grafana + Tempo + Loki + Prometheus + OTel collector in one container (dev only).
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI (admin / admin)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes: ["lgtm-data:/data"]

  discord-adapter:
    build: { context: ., dockerfile: apps/discord-adapter/Dockerfile }
    expose: ["8081"]
    environment:
      DISCORD_ADAPTER_PORT: "8081"
      COORDINATOR_URL: http://coordinator:8080
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_PROJECT_CATEGORY_ID: ${DISCORD_PROJECT_CATEGORY_ID:-}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID:-}
      DISCORD_MEMBER_ROLE_IDS: ${DISCORD_MEMBER_ROLE_IDS:-}
    depends_on: [coordinator]

  email-adapter:
    build: { context: ., dockerfile: apps/email-adapter/Dockerfile }
    environment:
      COORDINATOR_URL: http://coordinator:8080
    depends_on: [coordinator]

volumes:
  coordinator-data:
  lgtm-data:

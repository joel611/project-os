# Local POC target. The Watcher runs on the host (it spawns local Claude Code) and
# talks to the published Coordinator port: MCP_URL=http://localhost:8080/mcp (§5.6).
services:
  coordinator:
    build: { context: ., dockerfile: apps/coordinator/Dockerfile }
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/project-os.sqlite
      PI_STORAGE_PATH: /data/pi-durable.sqlite
      # Discord runs inside the Coordinator when the token is set. For the split layout
      # (`--profile split`), set DISCORD_SPLIT_GATEWAY_URL=http://discord-gateway:8081 and the token is ignored here.
      DISCORD_SPLIT_GATEWAY_URL: ${DISCORD_SPLIT_GATEWAY_URL:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_PROJECT_CATEGORY_ID: ${DISCORD_PROJECT_CATEGORY_ID:-}
      DISCORD_MEMBER_ROLE_IDS: ${DISCORD_MEMBER_ROLE_IDS:-}
      WORKER_ID: ${WORKER_ID:-local-claude-1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHAT_MODEL_PROVIDER: ${CHAT_MODEL_PROVIDER:-openrouter}
      CHAT_MODEL_ID: ${CHAT_MODEL_ID:-anthropic/claude-sonnet-4.5}
      JEV_MODEL_ID: ${JEV_MODEL_ID:-typesafe/jev-1.14}
      INTENT_CONFIDENCE_THRESHOLD: ${INTENT_CONFIDENCE_THRESHOLD:-0.5}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      DISCORD_REQUIRE_MENTION: ${DISCORD_REQUIRE_MENTION:-true}
      DISCORD_PROJECT_CHANNEL_AUTO_CREATE: ${DISCORD_PROJECT_CHANNEL_AUTO_CREATE:-true}
      # Account linking (/connect); off unless BETTER_AUTH_SECRET and a client are set. See SETUP.md.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Cloud sandbox workers (Daytona, Cloudflare Sandbox); off unless a provider is set. See SETUP.md §6.
      WORKER_PROVIDERS: ${WORKER_PROVIDERS:-}
      DEFAULT_WORKER_TYPE: ${DEFAULT_WORKER_TYPE:-}
      SANDBOX_MCP_URL: ${SANDBOX_MCP_URL:-}
      SANDBOX_PI_MODEL: ${SANDBOX_PI_MODEL:-}
      SANDBOX_SESSION_TIMEOUT_SECONDS: ${SANDBOX_SESSION_TIMEOUT_SECONDS:-}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:-}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-}
      DAYTONA_SNAPSHOT: ${DAYTONA_SNAPSHOT:-}
      DAYTONA_MAX_CONCURRENT: ${DAYTONA_MAX_CONCURRENT:-}
      DAYTONA_MCP_URL: ${DAYTONA_MCP_URL:-}
      BOAT_API_KEY: ${BOAT_API_KEY:-}
      BOAT_API_URL: ${BOAT_API_URL:-}
      BOAT_SANDBOX_SIZE: ${BOAT_SANDBOX_SIZE:-}
      BOAT_MAX_CONCURRENT: ${BOAT_MAX_CONCURRENT:-}
      CLOUDFLARE_SANDBOX_URL: ${CLOUDFLARE_SANDBOX_URL:-}
      CLOUDFLARE_SANDBOX_TOKEN: ${CLOUDFLARE_SANDBOX_TOKEN:-}
      CLOUDFLARE_SANDBOX_MAX_CONCURRENT: ${CLOUDFLARE_SANDBOX_MAX_CONCURRENT:-}
      WATCHER_INSTALL_COMMAND: ${WATCHER_INSTALL_COMMAND:-}
      # Pi Durable traces + metrics -> the lgtm service (Grafana at http://localhost:3000).
      # Forced, like the data paths: a host .env value (localhost:4318) would point at the container itself.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
    volumes: ["coordinator-data:/data"]
    depends_on: [lgtm]

  # Grafana + Tempo + Loki + Prometheus + OTel collector in one container (dev only).
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana UI (admin / admin)
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes: ["lgtm-data:/data"]

  # Optional split layout: Discord in its own container, for a Coordinator that can't host it
  # or to scale them apart. `docker compose --profile split up`, with DISCORD_SPLIT_GATEWAY_URL set.
  discord-gateway:
    profiles: ["split"]
    build: { context: ., dockerfile: apps/discord-gateway/Dockerfile }
    expose: ["8081"]
    environment:
      DISCORD_SPLIT_GATEWAY_PORT: "8081"
      COORDINATOR_URL: http://coordinator:8080
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_PROJECT_CATEGORY_ID: ${DISCORD_PROJECT_CATEGORY_ID:-}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID:-}
      DISCORD_MEMBER_ROLE_IDS: ${DISCORD_MEMBER_ROLE_IDS:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    depends_on: [coordinator]

volumes:
  coordinator-data:
  lgtm-data:

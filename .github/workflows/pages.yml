name: Pages

# Builds the product site from the Markdown in apps/site and publishes it to GitHub Pages.
# Runs only when the site, this workflow, or the dependencies change.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "bun.lock"
  pull_request:
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "Last updated" dates come from git history
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Fails on dead links, so a PR that breaks a doc link fails here.
      - run: bun run --cwd apps/site build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

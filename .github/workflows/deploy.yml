name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment (and Alchemy stage) to deploy
        type: choice
        options: [uat, prod]
        default: uat

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A push to main deploys to uat; prod is a manual workflow_dispatch.
    environment: ${{ inputs.environment || 'uat' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run deploy --stage ${{ inputs.environment || 'uat' }} --yes
        env:
          # Names mirror .env.cf.uat. Upload them with
          # `bun run env:gh -- --env uat --file .env.cf.uat`: secrets land in `secrets.*`, the rest
          # in `vars.*`, and GITHUB_* keys are stored as GH_* (GitHub reserves that prefix).
          # An unset var expands to "" here, which is not the same as unset. alchemy.run.ts treats ""
          # as unset for optional vars (NonEmptyString), so those just aren't bound.
          # Variables
          ROOT_DOMAIN: ${{ vars.ROOT_DOMAIN }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          COORDINATOR_URL: ${{ vars.COORDINATOR_URL }}
          CHAT_MODEL_PROVIDER: ${{ vars.CHAT_MODEL_PROVIDER }}
          CHAT_MODEL_ID: ${{ vars.CHAT_MODEL_ID }}
          JEV_MODEL_ID: ${{ vars.JEV_MODEL_ID }}
          INTENT_CONFIDENCE_THRESHOLD: ${{ vars.INTENT_CONFIDENCE_THRESHOLD }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
          DISCORD_PROJECT_CATEGORY_ID: ${{ vars.DISCORD_PROJECT_CATEGORY_ID }}
          DISCORD_PROJECT_CHANNEL_AUTO_CREATE: ${{ vars.DISCORD_PROJECT_CHANNEL_AUTO_CREATE }}
          ADMIN_CHANNEL_ID: ${{ vars.ADMIN_CHANNEL_ID }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          DISCORD_MEMBER_ROLE_IDS: ${{ vars.DISCORD_MEMBER_ROLE_IDS }}
          DISCORD_REQUIRE_MENTION: ${{ vars.DISCORD_REQUIRE_MENTION }}
          CHANNEL_DIGEST: ${{ vars.CHANNEL_DIGEST }}
          CHANNEL_DIGEST_NOTIFY: ${{ vars.CHANNEL_DIGEST_NOTIFY }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GITHUB_CLIENT_ID: ${{ vars.GH_CLIENT_ID }}
          CLICKUP_CLIENT_ID: ${{ vars.CLICKUP_CLIENT_ID }}
          DISCORD_SPLIT_GATEWAY_URL: ${{ vars.DISCORD_SPLIT_GATEWAY_URL }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          SHARED_WORKER_MAX_TICKETS: ${{ vars.SHARED_WORKER_MAX_TICKETS }}
          WATCHER_INSTALL_COMMAND: ${{ vars.WATCHER_INSTALL_COMMAND }}
          WORKER_PROVIDERS: ${{ vars.WORKER_PROVIDERS }}
          SANDBOX_MCP_URL: ${{ vars.SANDBOX_MCP_URL }}
          SANDBOX_PI_MODEL: ${{ vars.SANDBOX_PI_MODEL }}
          SANDBOX_SESSION_TIMEOUT_SECONDS: ${{ vars.SANDBOX_SESSION_TIMEOUT_SECONDS }}
          DAYTONA_API_URL: ${{ vars.DAYTONA_API_URL }}
          DAYTONA_SNAPSHOT: ${{ vars.DAYTONA_SNAPSHOT }}
          DAYTONA_MAX_CONCURRENT: ${{ vars.DAYTONA_MAX_CONCURRENT }}
          BOAT_API_URL: ${{ vars.BOAT_API_URL }}
          BOAT_SANDBOX_SIZE: ${{ vars.BOAT_SANDBOX_SIZE }}
          BOAT_MAX_CONCURRENT: ${{ vars.BOAT_MAX_CONCURRENT }}
          CLOUDFLARE_SANDBOX_URL: ${{ vars.CLOUDFLARE_SANDBOX_URL }}
          CLOUDFLARE_SANDBOX_MAX_CONCURRENT: ${{ vars.CLOUDFLARE_SANDBOX_MAX_CONCURRENT }}
          # Secrets
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COORDINATOR_SERVICE_TOKEN: ${{ secrets.COORDINATOR_SERVICE_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          CLICKUP_CLIENT_SECRET: ${{ secrets.CLICKUP_CLIENT_SECRET }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          BOAT_API_KEY: ${{ secrets.BOAT_API_KEY }}
          CLOUDFLARE_SANDBOX_TOKEN: ${{ secrets.CLOUDFLARE_SANDBOX_TOKEN }}

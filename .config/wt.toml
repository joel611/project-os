# Worktrunk project hooks. Runs on `wt switch --create`.

# Copy gitignored files listed in .worktreeinclude from the primary worktree
# (.env, node_modules, build caches). Never overwrites existing files.
# Runs first so the install below is a fast no-op/relink instead of a cold start.
[[pre-start]]
copy-ignored = "wt step copy-ignored"

# Blocking: ensure deps match the lockfile (cheap after node_modules is copied).
[[pre-start]]
install = "bun install --frozen-lockfile"

# Fallback for fresh clones where the primary worktree has no .env yet.
# `-n` never overwrites an existing .env.
[[pre-start]]
env-fallback = "cp -n .env.example .env"
